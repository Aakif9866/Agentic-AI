# Module 10 offline eval gate. Runs on every PR (a choice made in V2_PLAN.md).
#
# ~30 cases, ~2-3 agent calls + 1 judge call each, on Groq's free tier, so it
# costs quota, not money. Fails the PR when tool-selection accuracy drops more
# than 5 points below evals/baseline.json. Each run is a LangSmith experiment.
#
# Secrets (Settings → Secrets → Actions): GROQ_API_KEY, TAVILY_API_KEY, LANGSMITH_API_KEY.
# PRs from forks don't get secrets, so this job skips them instead of failing.
name: module10 evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "Module 10 - Project - Build Your Own ChatGPT Agent"
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: module10-ci
    steps:
      - uses: actions/checkout@v4

      - name: Skip without secrets (fork PRs)
        id: keys
        run: |
          if [ -z "$GROQ_API_KEY" ] || [ -z "$LANGSMITH_API_KEY" ] || [ -z "$TAVILY_API_KEY" ]; then
            echo "::warning::eval secrets missing, skipping"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v5
        if: steps.keys.outputs.ok == 'true'
        with:
          enable-cache: true

      - name: Install
        if: steps.keys.outputs.ok == 'true'
        run: uv sync --frozen

      - name: Run eval suite (gate)
        if: steps.keys.outputs.ok == 'true'
        run: uv run python evals/run_evals.py --prefix "ci-pr${{ github.event.pull_request.number }}"
