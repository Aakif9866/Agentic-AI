# Hourly health check for the deployed Module 10 agent.
# Reads the last hour of LangSmith traces; if tool error rate > 10% or
# p95 latency > 15 s, posts to a Discord webhook. Light: no model calls, no torch.
#
# Secrets: LANGSMITH_API_KEY, DISCORD_WEBHOOK_URL (optional: without it the
# alert is only printed in the job log). Variable: LANGSMITH_PROJECT.
name: module10 alert

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check last hour
        working-directory: "Module 10 - Project - Build Your Own ChatGPT Agent"
        env:
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT || 'agentic-ai-course' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$LANGSMITH_API_KEY" ]; then echo "::warning::LANGSMITH_API_KEY not set"; exit 0; fi
          uv run --no-project --with langsmith --with python-dotenv python metrics.py --alert
