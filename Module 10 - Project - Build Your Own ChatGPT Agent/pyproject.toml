[project]
name = "module10-chatgpt-agent"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.143.0",
    "langchain==1.3.1",
    "langchain-community>=0.4.2",
    "langchain-deepseek>=1.2.1",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.0",
    "langchain-tavily>=0.2.18",
    "langgraph==1.2.0",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic>=2.14.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.14",
    "uvicorn>=0.54.0",
]

# Linux (the Docker image) gets CPU-only torch: the default PyPI wheel drags in
# ~3GB of CUDA libraries a GPU-less server never uses. macOS is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
